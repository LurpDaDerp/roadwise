<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>RoadWise</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(160deg, #00639A, #0A466E 55%, #04233A); color: #FFFFFF;
    }
    main { max-width: 22rem; padding: 2rem 1.5rem; text-align: center; }
    h1 { font-style: italic; font-size: 2.25rem; margin: 0 0 0.5rem; }
    p { margin: 0 0 2rem; line-height: 1.45; color: rgba(255, 255, 255, 0.85); }
    a.button {
      display: block; margin: 0 0 0.875rem; padding: 0.95rem 1rem; border-radius: 999px;
      font-weight: 600; text-decoration: none; border: 2px solid #FFFFFF;
    }
    a.primary { background: #FFFFFF; color: #111113; }
    a.secondary { color: #FFFFFF; }
  </style>
</head>
<body>
  <main>
    <h1>RoadWise</h1>
    <p>Someone shared their month on the road with you. Open it in RoadWise to see it.</p>
    <a class="button primary" id="open" href="roadwise://">Open in RoadWise</a>
    <a class="button secondary" href="https://apps.apple.com/app/idAPP_STORE_ID">Get RoadWise</a>
  </main>
  <script>
    // The page answers every /w/<id> path: the button opens the same Wrapped in the app.
    (function () {
      var m = /^\/w\/([A-Za-z0-9]{12})\/?$/.exec(window.location.pathname);
      if (m) document.getElementById('open').setAttribute('href', 'roadwise://w/' + m[1]);
    })();
  </script>
</body>
</html>
