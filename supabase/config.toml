# For detailed configuration reference documentation, visit:
# https://supabase.com/docs/guides/local-development/cli/config
# A string used to distinguish different Supabase projects on the same host. Defaults to the
# working directory name when running `supabase init`.
project_id = "RoadWise-V2"

[api]
enabled = true
# Port to use for the API URL.
port = 54621
# Schemas to expose in your API. Tables, views and stored procedures in this schema will get API
# endpoints. `public` and `graphql_public` schemas are included by default.
schemas = ["public", "graphql_public"]
# Extra schemas to add to the search_path of every request.
extra_search_path = ["public", "extensions"]
# The maximum number of rows returns from a view, table, or stored procedure. Limits payload size
# for accidental or malicious requests.
max_rows = 1000
# Controls whether new tables, views, sequences and functions created in the `public` schema by
# `postgres` are reachable through the Data API roles (`anon`, `authenticated`, `service_role`)
# without explicit GRANTs, matching the cloud default. Set to `false` to require explicit GRANTs
# instead. Left unset, a fresh project falls back to `true`.
# Off, as on every hosted project from 2026-10-30 (and every new one since 2026-05-30): nothing in
# `public` is reachable through the Data API without the explicit GRANT its migration makes, so the
# local stack and the tests see the same privileges production does.
auto_expose_new_tables = false

[api.tls]
# Enable HTTPS endpoints locally using a self-signed certificate.
enabled = false
# Paths to self-signed certificate pair.
# cert_path = "../certs/my-cert.pem"
# key_path = "../certs/my-key.pem"

[db]
# Port to use for the local database URL.
port = 54622
# Port used by db diff command to initialize the shadow database.
shadow_port = 54620
# Maximum amount of time to wait for health check when starting the local database.
health_timeout = "2m"
# The database major version to use. This has to be the same as your remote database's. Run `SHOW
# server_version;` on the remote database to check.
major_version = 17

[db.pooler]
enabled = false
# Port to use for the local connection pooler.
port = 54629
# Specifies when a server connection can be reused by other clients.
# Configure one of the supported pooler modes: `transaction`, `session`.
pool_mode = "transaction"
# How many server connections to allow per user/database pair.
default_pool_size = 20
# Maximum number of client connections allowed.
max_client_conn = 100

# [db.vault]
# secret_key = "env(SECRET_VALUE)"

[db.migrations]
# If disabled, migrations will be skipped during a db push or reset.
enabled = true
# Specifies an ordered list of schema files, directories, or glob patterns that describe your database.
# Supports paths relative to supabase directory: "./schemas/*.sql", "./database".
schema_paths = []

[db.seed]
# If enabled, seeds the database after migrations during a db reset.
enabled = true
# Specifies an ordered list of seed files to load during db reset.
# Supports glob patterns relative to supabase directory: "./seeds/*.sql"
sql_paths = ["./seed.sql"]

[db.network_restrictions]
# Enable management of network restrictions.
enabled = false
# List of IPv4 CIDR blocks allowed to connect to the database.
# Defaults to allow all IPv4 connections. Set empty array to block all IPs.
allowed_cidrs = ["0.0.0.0/0"]
# List of IPv6 CIDR blocks allowed to connect to the database.
# Defaults to allow all IPv6 connections. Set empty array to block all IPs.
allowed_cidrs_v6 = ["::/0"]

# Uncomment to reject non-secure connections to the database.
# [db.ssl_enforcement]
# enabled = true

[realtime]
enabled = true
# Bind realtime via either IPv4 or IPv6. (default: IPv4)
# ip_version = "IPv6"
# The maximum length in bytes of HTTP request headers. (default: 4096)
# max_header_length = 4096

[studio]
enabled = true
# Port to use for Supabase Studio.
port = 54623
# External URL of the API server that frontend connects to.
api_url = "http://127.0.0.1"
# OpenAI API Key to use for Supabase AI in the Supabase Studio.
openai_api_key = "env(OPENAI_API_KEY)"

# Email testing server. Emails sent with the local dev setup are not actually sent - rather, they
# are monitored, and you can view the emails that would have been sent from the web interface.
[local_smtp]
enabled = true
# Port to use for the email testing server web interface.
port = 54624
# Uncomment to expose additional ports for testing user applications that send emails.
# smtp_port = 54625
# pop3_port = 54626
# admin_email = "admin@email.com"
# sender_name = "Admin"

[storage]
enabled = true
# The maximum file size allowed (e.g. "5MB", "500KB").
file_size_limit = "50MiB"

# Uncomment to configure local storage buckets
# [storage.buckets.images]
# public = false
# file_size_limit = "50MiB"
# allowed_mime_types = ["image/png", "image/jpeg"]
# objects_path = "./images"

# Allow connections via S3 compatible clients
[storage.s3_protocol]
enabled = true

# Image transformation API is available to Supabase Pro plan.
# [storage.image_transformation]
# enabled = true

# Store analytical data in S3 for running ETL jobs over Iceberg Catalog
# This feature is only available on the hosted platform.
[storage.analytics]
enabled = false
max_namespaces = 5
max_tables = 10
max_catalogs = 2

# Analytics Buckets is available to Supabase Pro plan.
# [storage.analytics.buckets.my-warehouse]

# Store vector embeddings in S3 for large and durable datasets
[storage.vector]
enabled = true
max_buckets = 10
max_indexes = 5

# Vector Buckets is available to Supabase Pro plan.
# [storage.vector.buckets.documents-openai]

[auth]
enabled = true
# The base URL of your website. Used as an allow-list for redirects and for constructing URLs used
# in emails.
site_url = "http://127.0.0.1:3000"
# The public URL that Auth serves on. Defaults to the API external URL with `/auth/v1` appended.
# external_url = ""
# A list of *exact* URLs that auth providers are permitted to redirect to post authentication.
additional_redirect_urls = ["https://127.0.0.1:3000"]
# How long tokens are valid for, in seconds. Defaults to 3600 (1 hour), maximum 604,800 (1 week).
jwt_expiry = 3600
# JWT issuer URL. If not set, defaults to auth.external_url.
# jwt_issuer = ""
# Path to JWT signing key. DO NOT commit your signing keys file to git.
# signing_keys_path = "./signing_keys.json"
# If disabled, the refresh token will never expire.
enable_refresh_token_rotation = true
# Allows refresh tokens to be reused after expiry, up to the specified interval in seconds.
# Requires enable_refresh_token_rotation = true.
refresh_token_reuse_interval = 10
# Allow/disallow new user signups to your project.
enable_signup = true
# Allow/disallow anonymous sign-ins to your project.
enable_anonymous_sign_ins = false
# Allow/disallow testing manual linking of accounts
enable_manual_linking = false
# Passwords shorter than this value will be rejected as weak. Minimum 6, recommended 8 or more.
minimum_password_length = 8
# Passwords that do not meet the following requirements will be rejected as weak. Supported values
# are: `letters_digits`, `lower_upper_letters_digits`, `lower_upper_letters_digits_symbols`
# An email account's password: at least 8 characters, with at least one letter and one digit. The
# app checks the same before it sends one (src/features/auth/emailPassword.ts, passwordProblem).
password_requirements = "letters_digits"

# Configure passkey sign-ins.
# [auth.passkey]
# enabled = false

# Configure WebAuthn relying party settings (required when passkey is enabled).
# [auth.webauthn]
# rp_display_name = "Supabase"
# rp_id = "localhost"
# rp_origins = ["http://127.0.0.1:3000"]

[auth.rate_limit]
# Number of emails that can be sent per hour. Requires auth.email.smtp to be enabled.
email_sent = 2
# Number of SMS messages that can be sent per hour. Requires auth.sms to be enabled.
sms_sent = 30
# Number of anonymous sign-ins that can be made per hour per IP address. Requires enable_anonymous_sign_ins = true.
anonymous_users = 30
# Number of sessions that can be refreshed in a 5 minute interval per IP address.
token_refresh = 150
# Number of sign up and sign-in requests that can be made in a 5 minute interval per IP address (excludes anonymous users).
# Covers sign-up, Resend code, Forgot password and a password change. A driver needs three or four.
# Every per-IP limit here is a bucket of 30 that refills at this rate, so a burst of 30 goes through
# first. Production sets the same ([remotes.production.auth.rate_limit]).
sign_in_sign_ups = 20
# Number of OTP / Magic link verifications that can be made in a 5 minute interval per IP address.
# The hosted default: a code is 8 digits, so 30 at once and then 30 every 5 minutes is no help to a
# guesser, and a class confirming on one school network still fits. Production sets the same.
token_verifications = 30
# Number of Web3 logins that can be made in a 5 minute interval per IP address.
web3 = 30

# Configure one of the supported captcha providers: `hcaptcha`, `turnstile`.
# [auth.captcha]
# enabled = true
# provider = "hcaptcha"
# secret = ""

[auth.email]
# Allow/disallow new user signups via email to your project.
# On locally only: with Apple and Google off here, a password is the local stack's one way in (the
# seed scripts sign in as their accounts with one). Production has it off.
enable_signup = true
# If enabled, a user will be required to confirm any email change on both the old, and new email
# addresses. If disabled, only the new email is required to confirm.
double_confirm_changes = true
# If enabled, users need to confirm their email address before signing in.
# On, as in production: an email sign-up types the 8-digit code from its confirmation mail into the
# app. The local stack sends no real mail; Mailpit catches it at http://127.0.0.1:54624 ([local_smtp]).
# Accounts made through the admin API with email_confirm (the seed scripts) and the tests' own
# auth.users rows need no code.
enable_confirmations = true
# If enabled, users will need to reauthenticate or have logged in recently to change their password.
# On: a password changes only from a session less than a day old. The app changes one only right
# after a code signs in (sign-up and Forgot password), so it never needs a reauthentication mail.
secure_password_change = true
# Controls the minimum amount of time that must pass before sending another signup confirmation or password reset email.
max_frequency = "1s"
# Number of characters used in the email OTP. The app's code field takes 8 (CODE_LENGTH).
otp_length = 8
# Number of seconds before the email OTP expires (defaults to 1 hour). 10 minutes, as in production:
# the mails say so.
otp_expiry = 600

# Use a production-ready SMTP server
# [auth.email.smtp]
# enabled = true
# host = "smtp.sendgrid.net"
# port = 587
# user = "apikey"
# pass = "env(SENDGRID_API_KEY)"
# admin_email = "admin@email.com"
# sender_name = "Admin"

# The two mails as Auth itself renders them, for the local stack (into Mailpit). Production sends
# every mail through its send-email hook instead (supabase/functions/send-email/mail.ts writes the
# same mails). The 8-digit code (in the subject too, so the phone can offer it), no link, so a mail
# scanner that opens links can't use it up and the code works whichever device reads the mail.
# content_path is read from the repo root.
[auth.email.template.confirmation]
subject = "{{ .Token }} is your RoadWise code"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "{{ .Token }} is your RoadWise reset code"
content_path = "./supabase/templates/recovery.html"

# Uncomment to customize notification email template
# [auth.email.notification.password_changed]
# enabled = true
# subject = "Your password has been changed"
# content_path = "./supabase/templates/password_changed_notification.html"

[auth.sms]
# Allow/disallow new user signups via SMS to your project.
enable_signup = false
# If enabled, users need to confirm their phone number before signing in.
enable_confirmations = false
# Template for sending OTP to users
template = "Your code is {{ .Code }}"
# Controls the minimum amount of time that must pass before sending another sms otp.
max_frequency = "5s"

# Use pre-defined map of phone number to OTP for testing.
# [auth.sms.test_otp]
# 4152127777 = "123456"

# Configure logged in session timeouts.
# [auth.sessions]
# Force log out after the specified duration.
# timebox = "24h"
# Force log out if the user has been inactive longer than the specified duration.
# inactivity_timeout = "8h"

# This hook runs before a new user is created and allows developers to reject the request based on the incoming user object.
# [auth.hook.before_user_created]
# enabled = true
# uri = "pg-functions://postgres/auth/before-user-created-hook"

# This hook runs before a token is issued and allows you to add additional claims based on the authentication method used.
# [auth.hook.custom_access_token]
# enabled = true
# uri = "pg-functions://<database>/<schema>/<hook_name>"

# Every mail Auth sends goes through the send-email function (supabase/functions/send-email), which
# mails only the sign-up code and the password-reset code (an account that signs in with Apple or
# Google gets a reminder of that instead of a reset code) and refuses every other kind, so no other
# code is ever minted. It is on in production ([remotes.production.auth.hook.send_email]). Locally it
# is off and Mailpit takes the mail (the templates above): switching it on needs SEND_EMAIL_HOOK_SECRET
# ("v1,whsec_<base64>") in the CLI's environment and in the function's (with RESEND_API_KEY and
# RESEND_FROM).
[auth.hook.send_email]
enabled = false
uri = "http://host.docker.internal:54621/functions/v1/send-email"
secrets = "env(SEND_EMAIL_HOOK_SECRET)"

# Configure one of the supported SMS providers: `twilio`, `twilio_verify`, `messagebird`, `textlocal`, `vonage`.
[auth.sms.twilio]
enabled = false
account_sid = ""
message_service_sid = ""
# DO NOT commit your Twilio auth token to git. Use environment variable substitution instead:
auth_token = "env(SUPABASE_AUTH_SMS_TWILIO_AUTH_TOKEN)"

# Multi-factor-authentication is available to Supabase Pro plan.
[auth.mfa]
# Control how many MFA factors can be enrolled at once per user.
max_enrolled_factors = 10

# Control MFA via App Authenticator (TOTP)
[auth.mfa.totp]
enroll_enabled = false
verify_enabled = false

# Configure MFA via Phone Messaging
[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false
otp_length = 6
template = "Your code is {{ .Code }}"
max_frequency = "5s"

# Configure MFA via WebAuthn
# [auth.mfa.web_authn]
# enroll_enabled = true
# verify_enabled = true

# Use an external OAuth provider. The full list of providers are: `apple`, `azure`, `bitbucket`,
# `discord`, `facebook`, `github`, `gitlab`, `google`, `keycloak`, `linkedin_oidc`, `notion`, `twitch`,
# `twitter`, `x`, `slack`, `spotify`, `workos`, `zoom`.
[auth.external.apple]
enabled = false
client_id = ""
# DO NOT commit your OAuth provider secret to git. Use environment variable substitution instead:
secret = "env(SUPABASE_AUTH_EXTERNAL_APPLE_SECRET)"
# Overrides the default auth callback URL derived from auth.external_url.
redirect_uri = ""
# Overrides the default auth provider URL. Used to support self-hosted gitlab, single-tenant Azure,
# or any other third-party OIDC providers.
url = ""
# If enabled, the nonce check will be skipped. Required for local sign in with Google auth.
skip_nonce_check = false
# If enabled, it will allow the user to successfully authenticate when the provider does not return an email address.
email_optional = false

# Allow Solana wallet holders to sign in to your project via the Sign in with Solana (SIWS, EIP-4361) standard.
# You can configure "web3" rate limit in the [auth.rate_limit] section and set up [auth.captcha] if self-hosting.
[auth.web3.solana]
enabled = false

# Use Firebase Auth as a third-party provider alongside Supabase Auth.
[auth.third_party.firebase]
enabled = false
# project_id = "my-firebase-project"

# Use Auth0 as a third-party provider alongside Supabase Auth.
[auth.third_party.auth0]
enabled = false
# tenant = "my-auth0-tenant"
# tenant_region = "us"

# Use AWS Cognito (Amplify) as a third-party provider alongside Supabase Auth.
[auth.third_party.aws_cognito]
enabled = false
# user_pool_id = "my-user-pool-id"
# user_pool_region = "us-east-1"

# Use Clerk as a third-party provider alongside Supabase Auth.
[auth.third_party.clerk]
enabled = false
# Obtain from https://clerk.com/setup/supabase
# domain = "example.clerk.accounts.dev"

# OAuth server configuration
[auth.oauth_server]
# Enable OAuth server functionality
enabled = false
# Path for OAuth consent flow UI
authorization_url_path = "/oauth/consent"
# Allow dynamic client registration
allow_dynamic_registration = false

[edge_runtime]
enabled = true
# Supported request policies: `oneshot`, `per_worker`.
# `per_worker` (default) — enables hot reload during local development.
# `oneshot` — fallback mode if hot reload causes issues (e.g. in large repos or with symlinks).
policy = "per_worker"
# Port to attach the Chrome inspector for debugging edge functions.
inspector_port = 8083
# The Deno major version to use.
deno_version = 2

# [edge_runtime.secrets]
# secret_key = "env(SECRET_VALUE)"

# Every function shares one import map, supabase/functions/deno.json (bare npm specifiers like
# @supabase/supabase-js and zod, plus the scoring copy's extensionless imports). The CLI only finds a
# deno.json inside a function's own folder by itself, so each function names the shared one here.
[functions.account-delete]
import_map = "./functions/deno.json"

[functions.account-export]
import_map = "./functions/deno.json"

[functions.finalize-trip]
import_map = "./functions/deno.json"

[functions.live-activity-start]
import_map = "./functions/deno.json"

# push-sender is called by pg_cron (private.dispatch_push, 0005_push), not by a user: it authenticates the
# signed X-Sweep-Signature header itself, so the gateway JWT check is off for it alone.
[functions.push-sender]
verify_jwt = false
import_map = "./functions/deno.json"

# send-email is Auth's Send Email hook: Auth calls it with the hook's Standard Webhooks signature, not
# a user's JWT, and it checks that signature itself, so the gateway JWT check is off for it too.
[functions.send-email]
verify_jwt = false
import_map = "./functions/deno.json"

[functions.speed-limits]
import_map = "./functions/deno.json"

[functions.trip-actions]
import_map = "./functions/deno.json"

[functions.weather]
import_map = "./functions/deno.json"

[analytics]
enabled = true
port = 54627
# Configure one of the supported backends: `postgres`, `bigquery`.
backend = "postgres"

# Experimental features may be deprecated any time
[experimental]
# Configures Postgres storage engine to use OrioleDB (S3)
orioledb_version = ""
# Configures S3 bucket URL, eg. <bucket_name>.s3-<region>.amazonaws.com
s3_host = "env(S3_HOST)"
# Configures S3 bucket region, eg. us-east-1
s3_region = "env(S3_REGION)"
# Configures AWS_ACCESS_KEY_ID for S3 bucket
s3_access_key = "env(S3_ACCESS_KEY)"
# Configures AWS_SECRET_ACCESS_KEY for S3 bucket
s3_secret_key = "env(S3_SECRET_KEY)"

# pg-delta is the schema diff engine for db diff / db pull / db remote commit.
# Set enabled = false to fall back to the legacy migra engine.
[experimental.pgdelta]
enabled = true
# Directory under `supabase/` where declarative files are written.
# declarative_schema_path = "./schemas"
# JSON string passed through to pg-delta SQL formatting. When omitted, SQL is
# formatted with uppercase keywords, indent 2, max width 180, trailing commas,
# and column/key alignment. Set to "null" to emit raw, unformatted SQL.
# format_options = "{\"keywordCase\":\"upper\",\"indent\":2,\"maxWidth\":180,\"commaStyle\":\"trailing\"}"

# Hosted project overrides. The [auth] values above are LOCAL ONLY (a 127.0.0.1 site_url, mail caught
# by Mailpit, Apple and Google disabled). `supabase db push` loads this file (and stops if it
# is invalid) but changes no settings, while `supabase config push` after `supabase link` would carry
# those values to the hosted project; this stanza is what it sends instead. `supabase config diff` previews the push without changing anything.
[remotes.production]
project_id = "cjcpotetcslpscsbkdnj"

[remotes.production.auth]
site_url = "https://getroadwise.app"
# Sign-in is Apple, Google, or an email and password. Apple and Google are native (an id token handed
# to Auth) except Sign in with Apple on Android, Apple's web sign-in, which comes back to the app on
# roadwise://auth-callback (the only link Auth may send anywhere). Email accounts confirm their
# address, and reset a password, with a code typed into the app, so no link is ever mailed.
additional_redirect_urls = ["roadwise://auth-callback"]
# The password rules (8 characters, letters and digits) come from [auth].

# A new email account confirms its address before it is signed in: Auth mints an 8-digit code, the
# send-email hook below mails it, and the app's code screen takes it. Forgot password works the same
# way with a reset code. Apple and Google sign-in are not affected.
[remotes.production.auth.email]
enable_signup = true
enable_confirmations = true
secure_password_change = true
# One mail per address a minute: the app's "Resend code" waits the same 60 s (RESEND_COOLDOWN_S).
max_frequency = "60s"
# The app's code field takes 8 digits (CODE_LENGTH). A code lasts 10 minutes (the mails say so), with
# token_verifications below holding guesses down.
otp_length = 8
otp_expiry = 600

# No SMTP: Auth sends every mail through the send-email hook, which mails the sign-up and reset codes
# through Resend's HTTP API from no-reply@getroadwise.app (its own secrets: RESEND_API_KEY,
# RESEND_FROM, SEND_EMAIL_HOOK_SECRET) and refuses every other kind (magic link, invite, email change,
# reauthentication), so Auth's public endpoints can't mint those codes for any address. Forgot
# password for an account that signs in with Apple or Google mails no code, only a reminder of how it
# signs in. It caps each inbox at 5 mails an hour and 10 a day, and each IP address Auth reports at 20
# an hour and 50 a day (0045). `secrets` is the same "v1,whsec_<base64>" value
# as the function's SEND_EMAIL_HOOK_SECRET, read from the root .env (never committed) when
# `supabase config push` runs: unset, the push sends no secret and every code mail fails.
[remotes.production.auth.hook.send_email]
enabled = true
uri = "https://cjcpotetcslpscsbkdnj.supabase.co/functions/v1/send-email"
secrets = "env(SEND_EMAIL_HOOK_SECRET)"

# Resend's SMTP server is the project's mail server too. With the hook on, Auth sends nothing
# through it (the hook sends every mail); it is set so the project counts as having its own mail
# server: Supabase's built-in sender only mails the organisation's own members and holds the project
# to 2 mails an hour, and neither may apply to the hook's mails. Same key as send-email
# (RESEND_API_KEY, sending access, getroadwise.app only), read from the root .env at the push.
[remotes.production.auth.email.smtp]
enabled = true
host = "smtp.resend.com"
port = 465
user = "resend"
pass = "env(RESEND_API_KEY)"
admin_email = "no-reply@getroadwise.app"
sender_name = "RoadWise"

# Per IP address unless noted. Auth answers anything over a limit with 429 ("Too many tries"). Each
# per-IP limit is a bucket of 30 that refills at the rate given, so a burst of 30 goes through first.
[remotes.production.auth.rate_limit]
# Mails the whole project may send an hour (sign-up and reset codes together). Room for a class
# signing up at once; Resend's free plan (100 a day) binds first.
email_sent = 60
# Sign-ups, Resend code, Forgot password and password changes, per 5 minutes.
sign_in_sign_ups = 20
# Code checks per 5 minutes: a driver needs one or two; a code is 8 digits.
token_verifications = 30
# Password sign-ins, Apple and Google id tokens and session refreshes share this one, per 5 minutes:
# the hosted default, as every signed-in phone behind one address (a carrier's shared NAT) refreshes
# through it.
token_refresh = 150

# MFA (TOTP and phone) and storage analytics stay off, as above: the app has no MFA screen and keeps
# nothing in Storage.

# What the hosted project already runs: the local pooler is smaller and must not reach it.
[remotes.production.db.pooler]
default_pool_size = 15
max_client_conn = 200

# Sign in with Apple: native on iPhone (expo-apple-authentication + signInWithIdToken), whose client
# id is the App ID and needs no secret. Android (shown only in a build with
# EXPO_PUBLIC_APPLE_WEB_SIGNIN=1) uses Apple's web sign-in, which needs a Services ID grouped with
# the App ID (return URL https://cjcpotetcslpscsbkdnj.supabase.co/auth/v1/callback) and a client
# secret, a JWT signed with a Sign in with Apple key that Apple lets live at most 6 months. When that
# is set up, set client_id = "<services id>,com.lurp.safedrive" (the Services ID first: the web
# sign-in uses only the first id, and Apple's web page takes only a Services ID; the iPhone's id
# token is accepted against any id listed) and add
#   secret = "env(SUPABASE_AUTH_EXTERNAL_APPLE_SECRET)"
# before `supabase config push`; until then this stays the App ID alone. With the App ID still in
# the list, a push never turns the iPhone's sign-in off.
[remotes.production.auth.external.apple]
enabled = true
client_id = "com.lurp.safedrive"

# Native Google sign-in: an id token handed to signInWithIdToken, from expo-auth-session on iPhone
# (the iOS client) and from Credential Manager on Android (issued to the web client; Google checks
# the app against the project's Android clients itself). client_id is every OAuth client id,
# comma-separated, the web one first. The app sends a hashed nonce with every request and
# the raw one to Supabase, so the nonce check stays on.
# The ids come from the root .env (never committed) when `supabase config push` runs. No client
# secret: it is needed only for the web OAuth redirect flow, which the app never uses.
[remotes.production.auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
skip_nonce_check = false
