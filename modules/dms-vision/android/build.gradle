// DmsVision: the RoadWise driver-monitoring native layer (README.md is the contract).
//
// Pinned native dependencies (verified on Google Maven / Maven Central; the plan's keep table):
//   com.google.mediapipe:tasks-vision              0.10.35  every build
//   androidx.camera:*                              1.4.2    every build (camera-view: the C2 preview)
//   com.microsoft.onnxruntime:onnxruntime-android  1.30.0   ONLY with DMS_GAZE_NET=1
// Do NOT use dynamic versions ('0.10.+', 'latest.integration'): EAS builds must be reproducible.
//
// The gaze-net switch (plan: Global Constraints, the gaze_direct release gate). `gaze_direct.onnx`,
// its meta file, ONNX Runtime and the Kotlin that uses them are compiled and packaged only when
// DMS_GAZE_NET=1 is in the environment (or -PdmsGazeNet=1 is given). Otherwise src/nogazenet
// supplies a GazeNet that reports itself unavailable. A production build can never carry the
// switch: configuration fails instead (plan rev2: rev1-M1). That covers an EAS production profile,
// and any release task when no EAS profile is set.
//
// compileSdk / minSdk / targetSdk / the Kotlin version come from expo-module-gradle-plugin, which
// reads the root project's Expo SDK 57 extras.

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'expo-module-gradle-plugin'

def dmsGazeNet = System.getenv('DMS_GAZE_NET') == '1' || project.findProperty('dmsGazeNet') == '1'
def easProfile = System.getenv('EAS_BUILD_PROFILE')
def releaseRequested = gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }
if (dmsGazeNet && (easProfile == 'production' || (easProfile == null && releaseRequested))) {
  throw new GradleException('DMS_GAZE_NET=1 is refused in a production build (release gate, U-2)')
}

group = 'com.roadwise.dmsvision'
version = '2.0.0'

android {
  namespace 'expo.modules.dmsvision'

  defaultConfig {
    versionCode 2
    versionName '2.0.0'
  }

  sourceSets {
    main {
      if (dmsGazeNet) {
        java.srcDirs += 'src/gazenet/java'
        assets.srcDirs += 'src/gazenet/assets'
      } else {
        java.srcDirs += 'src/nogazenet/java'
      }
    }
  }

  // The bundled models are read into memory (AssetManager.open) and handed over as a direct
  // ByteBuffer / byte array, so asset compression is irrelevant and no noCompress rule is needed.
}

dependencies {
  def cameraxVersion = '1.4.2'

  implementation "androidx.camera:camera-core:${cameraxVersion}"
  implementation "androidx.camera:camera-camera2:${cameraxVersion}"
  implementation "androidx.camera:camera-lifecycle:${cameraxVersion}"
  implementation "androidx.camera:camera-view:${cameraxVersion}"
  // androidx.lifecycle.Observer / LiveData come from camera-core's own API dependency
  // (lifecycle-livedata via camera-core 1.4.2); an explicit compileOnly pin broke Gradle's
  // consistent resolution on EAS (build e334cbc2), so none is declared here.

  implementation 'com.google.mediapipe:tasks-vision:0.10.35'
  if (dmsGazeNet) {
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.30.0'
  }
}
