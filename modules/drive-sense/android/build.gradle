// DriveSense - the RoadWise background drive-capture module (Android side, task N3).
//
// Pinned native dependencies. Do NOT use dynamic versions ('21.+', 'latest.integration'): EAS
// builds must be reproducible.
//   com.google.android.gms:play-services-location 21.3.0  activity transitions + fused location
//   androidx.core:core                           1.17.0  NotificationCompat, ServiceCompat,
//                                                          ContextCompat, PackageManagerCompat and
//                                                          IntentCompat ("Pause app activity if
//                                                          unused"; its ListenableFuture comes with
//                                                          core's own api dependency,
//                                                          com.google.guava:listenablefuture) (the
//                                                          version expo-modules-core 57 already ships)
//   com.facebook.react:react-android              (none)  HeadlessJsTaskService. Deliberately
//                                                          versionless: React Native's Gradle plugin
//                                                          substitutes the exact installed
//                                                          react-native (0.86.x) for this coordinate,
//                                                          the same form expo-modules-core and
//                                                          expo-file-system use. A literal version
//                                                          here could only disagree with it.
//
// compileSdk / minSdk / targetSdk / the Kotlin version come from expo-module-gradle-plugin,
// which reads the root project's Expo SDK 57 extras.

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'expo-module-gradle-plugin'

group = 'expo.modules.drivesense'
version = '0.2.0'

android {
  namespace 'expo.modules.drivesense'

  defaultConfig {
    versionCode 2
    versionName '0.2.0'
  }
}

dependencies {
  implementation 'com.google.android.gms:play-services-location:21.3.0'
  implementation 'androidx.core:core:1.17.0'
  implementation 'com.facebook.react:react-android'

  // JVM unit tests (src/test: the pure time base, the drive detector's policy and its decision
  // table); not part of the app build. org.json: the unit-test android.jar stubs every method of
  // the platform's copy, and the detector's self-test (DetectSelfTest) reads and answers its rows as
  // org.json, so the tests run it on the real library.
  testImplementation 'junit:junit:4.13.2'
  testImplementation 'org.json:json:20180813'
}
