// DriveSense - the RoadWise background drive-capture module (Android side, task N3).
//
// Pinned native dependencies. Do NOT use dynamic versions ('21.+', 'latest.integration'): EAS
// builds must be reproducible.
//   com.google.android.gms:play-services-location 21.3.0  activity transitions + fused location
//   androidx.core:core                           1.17.0  NotificationCompat, ServiceCompat,
//                                                          ContextCompat (the version
//                                                          expo-modules-core 57 already ships)
//   com.facebook.react:react-android              (none)  HeadlessJsTaskService. Deliberately
//                                                          versionless: React Native's Gradle plugin
//                                                          substitutes the exact installed
//                                                          react-native (0.86.x) for this coordinate,
//                                                          the same form expo-modules-core and
//                                                          expo-file-system use. A literal version
//                                                          here could only disagree with it.
//
// compileSdk / minSdk / targetSdk / the Kotlin version come from expo-module-gradle-plugin,
// which reads the root project's Expo SDK 57 extras - the same proven form as
// modules/dms-vision/android/build.gradle.

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'expo-module-gradle-plugin'

group = 'expo.modules.drivesense'
version = '0.2.0'

android {
  namespace 'expo.modules.drivesense'

  defaultConfig {
    versionCode 2
    versionName '0.2.0'
  }
}

dependencies {
  implementation 'com.google.android.gms:play-services-location:21.3.0'
  implementation 'androidx.core:core:1.17.0'
  implementation 'com.facebook.react:react-android'

  // JVM unit tests (src/test: the pure time base); not part of the app build.
  testImplementation 'junit:junit:4.13.2'
}
