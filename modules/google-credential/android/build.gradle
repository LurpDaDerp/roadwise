// GoogleCredential - Sign in with Google on Android through Credential Manager (Android only; the
// iPhone keeps expo-auth-session).
//
// Pinned native dependencies. Do NOT use dynamic versions: EAS builds must be reproducible.
//   androidx.credentials:credentials                     1.5.0  CredentialManager
//   androidx.credentials:credentials-play-services-auth  1.5.0  the Google Play services provider
//                                                               behind it on Android 13 and older
//   com.google.android.libraries.identity.googleid:googleid
//                                                        1.1.1  GetSignInWithGoogleOption,
//                                                               GoogleIdTokenCredential
//   androidx.core:core                                   1.17.0 ContextCompat (the version
//                                                               expo-modules-core 57 already ships)
//
// compileSdk / minSdk / targetSdk / the Kotlin version come from expo-module-gradle-plugin, which
// reads the root project's Expo SDK 57 extras. R8 keeps the Play services provider through
// proguard-rules.pro (consumerProguardFiles), as the Credential Manager docs ask.

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'expo-module-gradle-plugin'

group = 'expo.modules.googlecredential'
version = '0.1.0'

android {
  namespace 'expo.modules.googlecredential'

  defaultConfig {
    versionCode 1
    versionName '0.1.0'
    consumerProguardFiles 'proguard-rules.pro'
  }
}

dependencies {
  implementation 'androidx.credentials:credentials:1.5.0'
  implementation 'androidx.credentials:credentials-play-services-auth:1.5.0'
  implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
  implementation 'androidx.core:core:1.17.0'

  // JVM unit tests (src/test: the error mapping); not part of the app build.
  testImplementation 'junit:junit:4.13.2'
}
