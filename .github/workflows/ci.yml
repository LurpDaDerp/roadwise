name: CI

on:
  push:
    branches: [V2, main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    name: App (typecheck, lint, jest, lockfile)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # One sky test reads the device's own clock as US time (it passes in Los Angeles and New
      # York, not in UTC); the suite runs in the zone it is written and run in.
      TZ: America/Los_Angeles
    steps:
      - uses: actions/checkout@v4
      # Node 22 bundles npm 10, the npm EAS Build runs npm ci with.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --ci --maxWorkers=2
      - run: npm run lock:check

  android:
    name: Android (prebuild, Kotlin tests, debug build, 16 KB pages)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The Gradle the Expo SDK pins runs on JDK 17. The runner's own Android SDK (platforms,
      # build-tools, NDK, CMake) builds the app; Gradle fetches any missing piece itself.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # Caches ~/.gradle (wrapper, dependencies, build cache) between runs.
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      # The native project is generated (CNG), as EAS does. No secret is needed: without a
      # google-services.json the config leaves Firebase out, and without a Maps key the trip map is
      # blank, which a compile never sees.
      - run: npx expo prebuild --platform android --no-install
      # drive-sense's JVM unit tests (the time base, the drive detector's policy and decisions),
      # google-credential's Kotlin, and the whole app as a debug APK (no JS bundle: debug builds
      # load it from Metro). The 64-bit ABIs only: the ones the 16 KB check reads, in half the time.
      - name: Gradle (unit tests, compile, assembleDebug)
        working-directory: android
        run: ./gradlew --console=plain :drive-sense:testDebugUnitTest :google-credential:compileDebugKotlin :app:assembleDebug -PreactNativeArchitectures=arm64-v8a,x86_64
      # Google Play requires every native library to load on 16 KB-page phones (Android 15+ targets).
      # The script reads each 64-bit .so's LOAD segment alignment and its offset in the APK;
      # zipalign checks the same offsets with the SDK's own tool.
      - name: 16 KB page alignment
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          python3 scripts/check-16kb-pages.py "$APK"
          ZIPALIGN="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/zipalign"
          "$ZIPALIGN" -c -P 16 4 "$APK"

  functions:
    name: Edge functions (deno lint, check, test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.6
      # Unit tests only: they run with no permissions, so the integration test skips itself here
      # (the db job runs it against a local stack).
      - run: npm run functions:check
      - run: npm run functions:test

  db:
    name: Database (migrations, pgTAP, function integration)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      # Postgres and Auth only: the migrations, the pgTAP suite and the integration test need
      # nothing else. No secret is needed: every env() in config.toml is unset here.
      - run: supabase start -x realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      # npm run db:test
      - run: supabase db reset
      - run: supabase test db
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.6
      - name: finalize-trip + trip-actions integration test
        env:
          FUNCTIONS_IT_DB_URL: postgresql://postgres:postgres@127.0.0.1:54622/postgres
        run: deno test -A --config supabase/functions/deno.json supabase/functions/finalize-trip/integration.test.ts
